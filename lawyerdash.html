<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lawyer Portal — NyayaDheesh</title>
  <link rel="stylesheet" href="/css/design-system.css">
  <style>
    .dash-shell {
      max-width: 1320px;
      margin: 0 auto;
      padding: 24px 20px 56px;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }
    .dash-sidebar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 12px;
      position: sticky;
      top: calc(var(--nav-height) + 16px);
    }
    .dash-user-card {
      padding: 10px 12px 14px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .dash-nav { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 3px; }
    .dash-nav button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 0;
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--text-secondary);
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s, color 0.15s;
    }
    .dash-nav button:hover { background: var(--ivory); color: var(--navy); }
    .dash-nav button.active { background: var(--navy); color: #FFFFFF; font-weight: 600; }
    .dash-nav .cnt {
      margin-left: auto;
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 99px;
      background: var(--gold-soft);
      color: var(--navy);
      font-weight: 700;
    }
    .dash-nav button.active .cnt { background: var(--gold); color: var(--navy-deep); }
    .dash-mobile-bar { display: none; margin-bottom: 16px; }

    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
    }
    .kpi-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
    .kpi-val { font-family: var(--font-heading); font-size: 2rem; font-weight: 600; color: var(--navy); line-height: 1.1; }

    .mini-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .cal-hd { font-size: 11px; font-weight: 600; color: var(--text-secondary); padding: 4px 0; }
    .cal-day { padding: 7px 2px; border-radius: 6px; font-size: 12.5px; }
    .cal-day.today { background: var(--gold-soft); color: var(--navy); font-weight: 700; }
    .cal-day.has-event { background: var(--navy); color: #FFFFFF; font-weight: 600; }

    @media (max-width: 980px) {
      .dash-shell { grid-template-columns: 1fr; }
      .dash-sidebar { display: none; }
      .dash-mobile-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="dash-shell">
      <aside class="dash-sidebar" id="desktopSidebar" aria-label="Lawyer portal navigation"></aside>
      <div>
        <div class="dash-mobile-bar">
          <button type="button" class="btn btn-outline btn-sm" id="openDashDrawer"></button>
          <span class="badge badge-demo">Lawyer Portal</span>
        </div>
        <div id="dashMain"></div>
      </div>
    </div>
  </main>

  <div class="drawer-backdrop" id="dashBackdrop"></div>
  <aside class="drawer left" id="dashDrawer" aria-label="Lawyer portal menu">
    <div class="drawer-header">
      <h3 style="margin:0;">Lawyer Portal</h3>
      <button type="button" class="icon-btn" id="closeDashDrawer" aria-label="Close"></button>
    </div>
    <div class="drawer-body" id="mobileSidebarHost"></div>
  </aside>

  <div id="site-footer"></div>

  <script src="/js/icons.js"></script>
  <script src="/js/data-seed.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    // Ensure demo lawyer session (auto-switches cleanly if user clicked directly, or requires login if completely signed out)
    let session = NDStore.AuthService.getSession();
    if (!session) {
      location.replace('auth.html?mode=login&next=lawyerdash.html');
    } else {
      if (session.role !== 'lawyer') {
        session = NDStore.AuthService.demoLogin('lawyer');
      }
      NDUI.initShell('dashboard');
      document.getElementById('openDashDrawer').innerHTML = ndIcon('menu', 16) + ' Lawyer Menu';
      document.getElementById('closeDashDrawer').innerHTML = ndIcon('x', 18);

      const dDrawer = document.getElementById('dashDrawer');
      const dBackdrop = document.getElementById('dashBackdrop');
      const toggleDrawer = (open) => { dDrawer.classList.toggle('open', open); dBackdrop.classList.toggle('open', open); };
      document.getElementById('openDashDrawer').onclick = () => toggleDrawer(true);
      document.getElementById('closeDashDrawer').onclick = () => toggleDrawer(false);
      dBackdrop.onclick = () => toggleDrawer(false);

      const SECTIONS = [
        { id: 'overview', label: 'Overview', icon: 'layout-grid' },
        { id: 'consultations', label: 'Client Consultations', icon: 'calendar' },
        { id: 'matters', label: 'Active Matters', icon: 'briefcase' },
        { id: 'mediations', label: 'Mediation Queue', icon: 'handshake' },
        { id: 'profile', label: 'Directory Profile & Slots', icon: 'user' },
        { id: 'settings', label: 'Settings', icon: 'settings' }
      ];

      let currentSec = (location.hash || '#overview').replace('#', '');
      if (!SECTIONS.some(s => s.id === currentSec)) currentSec = 'overview';
      let calDate = new Date();

      function goSection(sec) {
        currentSec = sec;
        history.replaceState(null, '', '#' + sec);
        toggleDrawer(false);
        renderAll();
      }

      function buildSidebar() {
        const prof = NDStore.AdvocateService.getProfile();
        const pendingAppts = NDStore.AppointmentService.list().filter(a => a.status === 'Pending').length;
        const activeMatters = NDStore.AdvocateService.listCases().filter(c => c.status !== 'Closed').length;
        return `
          <div class="dash-user-card">
            <span class="avatar-circle" style="width:38px;height:38px;font-size:14px;">${NDUI.esc(prof.initials)}</span>
            <div style="min-width:0;">
              <div style="font-weight:600;color:var(--navy);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${NDUI.esc(prof.name)}</div>
              <div class="text-xs text-muted">${NDUI.esc(prof.primaryArea)}</div>
            </div>
          </div>
          <ul class="dash-nav">
            ${SECTIONS.map(s => `
              <li>
                <button type="button" class="${s.id === currentSec ? 'active' : ''}" data-sec="${s.id}">
                  ${ndIcon(s.icon, 16)}<span>${NDUI.esc(s.label)}</span>
                  ${s.id === 'consultations' && pendingAppts > 0 ? `<span class="cnt">${pendingAppts}</span>` : ''}
                  ${s.id === 'matters' && activeMatters > 0 ? `<span class="cnt">${activeMatters}</span>` : ''}
                </button>
              </li>
            `).join('')}
            <li style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);">
              <button type="button" data-switch-citizen style="color:var(--gold-dark);font-weight:600;">
                ${ndIcon('refresh', 16)}<span>Switch to Citizen Portal</span>
              </button>
              <button type="button" data-logout style="color:var(--error);">
                ${ndIcon('log-out', 16)}<span>Logout</span>
              </button>
            </li>
          </ul>
        `;
      }

      function wireSidebar(root) {
        root.querySelectorAll('[data-sec]').forEach(b => b.onclick = () => goSection(b.dataset.sec));
        root.querySelector('[data-switch-citizen]').onclick = () => {
          NDStore.AuthService.demoLogin('client');
          NDUI.toast('Switched to Citizen Portal (Aarav Mehta).', 'success');
          setTimeout(() => { location.href = 'Dashboard.html'; }, 220);
        };
        root.querySelector('[data-logout]').onclick = () => {
          NDStore.AuthService.logout();
          NDUI.toast('Signed out of Lawyer Portal.', 'info');
          setTimeout(() => { location.href = 'index.html'; }, 280);
        };
      }

      function openAddMatterModal() {
        const bd = NDUI.openModal({
          title: 'Add New Matter',
          bodyHtml: `
            <form id="addMatForm">
              <div class="form-group"><label class="form-label">Client Name</label><input class="form-control" id="amClient" required placeholder="e.g. Rohan Verma"></div>
              <div class="form-group"><label class="form-label">Matter Title</label><input class="form-control" id="amTitle" required placeholder="e.g. Commercial Lease Review"></div>
              <div class="grid-2" style="gap:12px;">
                <div class="form-group"><label class="form-label">Category</label><select class="form-select" id="amCat">${NDSeed.PRACTICE_AREAS.map(a => `<option>${NDUI.esc(a)}</option>`).join('')}</select></div>
                <div class="form-group"><label class="form-label">Next Date</label><input class="form-control" type="date" id="amDate" value="${NDSeed.isoDay(5)}" required></div>
              </div>
              <div class="form-group"><label class="form-label">Matter Notes</label><textarea class="form-textarea" id="amNotes" placeholder="Summary of documents & next steps..."></textarea></div>
              <button type="submit" class="btn btn-primary btn-block">Add Matter</button>
            </form>
          `
        });
        bd.querySelector('#addMatForm').onsubmit = (e) => {
          e.preventDefault();
          try {
            NDStore.AdvocateService.addCase({
              clientName: bd.querySelector('#amClient').value,
              title: bd.querySelector('#amTitle').value,
              category: bd.querySelector('#amCat').value,
              nextDate: bd.querySelector('#amDate').value,
              notes: bd.querySelector('#amNotes').value
            });
            NDUI.closeModal();
            NDUI.toast('Matter added.', 'success');
            renderAll();
          } catch (err) { NDUI.toast(err.message, 'error'); }
        };
      }

      function renderCalendar(appts, cases) {
        const y = calDate.getFullYear(), m = calDate.getMonth();
        const title = calDate.toLocaleString('en-IN', { month: 'long', year: 'numeric' });
        const todayIso = NDSeed.isoDay(0);
        const dates = new Set([...appts.filter(a => a.status !== 'Cancelled').map(a => a.date), ...cases.map(c => c.nextDate)]);
        const first = new Date(y, m, 1).getDay();
        const total = new Date(y, m + 1, 0).getDate();
        let cells = ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(d => `<div class="cal-hd">${d}</div>`).join('');
        for (let i = 0; i < first; i++) cells += `<div class="cal-day"></div>`;
        for (let d = 1; d <= total; d++) {
          const iso = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const cls = dates.has(iso) ? 'has-event' : iso === todayIso ? 'today' : '';
          cells += `<div class="cal-day ${cls}">${d}</div>`;
        }
        return `
          <div class="flex justify-between items-center mb-3">
            <h3 style="margin:0;font-size:1.05rem;">Practice Calendar</h3>
            <div class="flex items-center gap-2">
              <button type="button" class="icon-btn" style="width:28px;height:28px;" id="lCalPrev">${ndIcon('chevron-left', 14)}</button>
              <span class="text-xs" style="font-weight:600;color:var(--navy);min-width:96px;text-align:center;">${title}</span>
              <button type="button" class="icon-btn" style="width:28px;height:28px;" id="lCalNext">${ndIcon('chevron-right', 14)}</button>
            </div>
          </div>
          <div class="mini-cal">${cells}</div>
        `;
      }

      function renderOverview() {
        const prof = NDStore.AdvocateService.getProfile();
        const appts = NDStore.AppointmentService.list();
        const cases = NDStore.AdvocateService.listCases();
        const upcoming = appts.filter(a => ['Pending', 'Confirmed', 'Rescheduled'].includes(a.status));
        const confirmed = appts.filter(a => ['Confirmed', 'Completed'].includes(a.status));
        const host = document.getElementById('dashMain');

        host.innerHTML = `
          <div class="flex justify-between items-center flex-wrap gap-3 mb-6">
            <div>
              <span class="eyebrow">Lawyer Portal</span>
              <h1 style="font-size:2rem;margin-bottom:4px;">Welcome, ${NDUI.esc(prof.name)}</h1>
              <p class="mb-0 text-sm">Manage client appointments, active matters, and your public directory listing.</p>
            </div>
            <div class="flex gap-2 flex-wrap">
              <button type="button" class="btn btn-primary btn-sm" id="btnNewMatter">${ndIcon('file-plus', 14)} Add Matter</button>
              <a href="Dashboard.html" class="btn btn-outline btn-sm" id="btnQuickCitizenView">${ndIcon('user', 14)} Citizen View</a>
            </div>
          </div>

          <div class="grid-4 mb-6">
            <div class="kpi-card"><div class="kpi-label">Active Matters</div><div class="kpi-val">${cases.filter(c => c.status !== 'Closed').length}</div></div>
            <div class="kpi-card"><div class="kpi-label">Upcoming Consultations</div><div class="kpi-val">${upcoming.length}</div></div>
            <div class="kpi-card"><div class="kpi-label">Confirmed / Completed</div><div class="kpi-val">${confirmed.length}</div></div>
            <div class="kpi-card"><div class="kpi-label">Consultation Fee</div><div class="kpi-val">₹${prof.fee.toLocaleString('en-IN')}</div></div>
          </div>

          <div class="grid-2" style="grid-template-columns:1.35fr 0.85fr;align-items:start;">
            <div class="card">
              <div class="flex justify-between items-center mb-3">
                <h3 style="margin:0;">Incoming Client Consultations</h3>
                <button type="button" class="btn btn-ghost btn-sm" onclick="goSection('consultations')">Manage All</button>
              </div>
              ${upcoming.slice(0, 5).map(a => `
                <div style="padding:12px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
                  <div>
                    <div class="flex items-center gap-2 flex-wrap">
                      <strong style="color:var(--navy);">${NDUI.esc(a.id)}</strong>
                      ${NDUI.statusBadge(a.status)}
                    </div>
                    <div class="text-xs text-muted mt-2">${NDUI.esc(a.date)} · ${NDUI.esc(a.slot)} IST · ${NDUI.esc(a.mode)} · ${NDUI.esc(a.caseSummary)}</div>
                  </div>
                  <div class="flex gap-2">
                    ${a.status === 'Pending' ? `<button type="button" class="btn btn-primary btn-sm" data-ast="Confirmed" data-aid="${NDUI.esc(a.id)}">Confirm</button>` : ''}
                    ${a.status === 'Confirmed' ? `<button type="button" class="btn btn-outline btn-sm" data-ast="Completed" data-aid="${NDUI.esc(a.id)}">Complete</button>` : ''}
                  </div>
                </div>
              `).join('') || '<p class="text-sm mb-0">No upcoming consultations.</p>'}
            </div>

            <div class="card">${renderCalendar(appts, cases)}</div>
          </div>
        `;
        document.getElementById('btnNewMatter').onclick = openAddMatterModal;
        document.getElementById('btnQuickCitizenView').onclick = (e) => {
          e.preventDefault();
          NDStore.AuthService.demoLogin('client');
          location.href = 'Dashboard.html';
        };
        document.getElementById('lCalPrev').onclick = () => { calDate.setMonth(calDate.getMonth() - 1); renderOverview(); };
        document.getElementById('lCalNext').onclick = () => { calDate.setMonth(calDate.getMonth() + 1); renderOverview(); };
        host.querySelectorAll('[data-ast]').forEach(b => b.onclick = () => {
          NDStore.AdvocateService.updateAppointmentStatus(b.dataset.aid, b.dataset.ast);
          NDUI.toast(`Consultation ${b.dataset.aid} marked ${b.dataset.ast}.`, 'success');
          renderAll();
        });
      }

      function renderConsultations() {
        const appts = NDStore.AppointmentService.list();
        const host = document.getElementById('dashMain');
        host.innerHTML = `
          <h1 style="font-size:1.8rem;margin:0 0 4px;">Client Consultations</h1>
          <p class="text-sm mb-4">Confirm, complete, or decline consultations—changes sync immediately to the Citizen Dashboard.</p>
          <div class="card">
            <div class="table-wrap"><table class="data-table">
              <thead><tr><th>Ref</th><th>Date &amp; Slot</th><th>Mode</th><th>Summary</th><th>Status</th><th>Actions</th></tr></thead>
              <tbody>
                ${appts.map(a => `
                  <tr>
                    <td><strong>${NDUI.esc(a.id)}</strong><div class="text-xs text-muted">${NDUI.esc(a.lawyerName)}</div></td>
                    <td>${NDUI.esc(a.date)} · ${NDUI.esc(a.slot)} IST</td>
                    <td>${NDUI.esc(a.mode)}</td>
                    <td style="max-width:260px;" class="text-xs">${NDUI.esc(a.caseSummary)}</td>
                    <td>${NDUI.statusBadge(a.status)}</td>
                    <td>
                      <div class="flex gap-2 flex-wrap">
                        ${a.status === 'Pending' ? `<button type="button" class="btn btn-primary btn-sm" data-ast="Confirmed" data-aid="${NDUI.esc(a.id)}">Confirm</button>` : ''}
                        ${['Confirmed', 'Rescheduled'].includes(a.status) ? `<button type="button" class="btn btn-outline btn-sm" data-ast="Completed" data-aid="${NDUI.esc(a.id)}">Mark Done</button>` : ''}
                        ${['Pending', 'Confirmed', 'Rescheduled'].includes(a.status) ? `<button type="button" class="btn btn-danger-outline btn-sm" data-ast="Cancelled" data-aid="${NDUI.esc(a.id)}">Decline</button>` : ''}
                      </div>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table></div>
          </div>
        `;
        host.querySelectorAll('[data-ast]').forEach(b => b.onclick = () => {
          NDStore.AdvocateService.updateAppointmentStatus(b.dataset.aid, b.dataset.ast);
          NDUI.toast(`Updated ${b.dataset.aid} to ${b.dataset.ast}.`, 'success');
          renderAll();
        });
      }

      function renderMatters() {
        const list = NDStore.AdvocateService.listCases();
        const host = document.getElementById('dashMain');
        host.innerHTML = `
          <div class="flex justify-between items-center flex-wrap gap-3 mb-4">
            <div><h1 style="font-size:1.8rem;margin:0 0 4px;">Active Matters</h1><p class="text-sm mb-0">Track client files and update case notes.</p></div>
            <button type="button" class="btn btn-primary btn-sm" id="addMatTop">${ndIcon('file-plus', 14)} Add Matter</button>
          </div>
          <div class="card">
            <div class="table-wrap"><table class="data-table">
              <thead><tr><th>Ref</th><th>Client &amp; Title</th><th>Category</th><th>Next Date</th><th>Status</th><th>Action</th></tr></thead>
              <tbody>
                ${list.map(c => `
                  <tr>
                    <td><strong>${NDUI.esc(c.id)}</strong></td>
                    <td><strong>${NDUI.esc(c.clientName)}</strong><div class="text-xs text-muted">${NDUI.esc(c.title)}</div></td>
                    <td>${NDUI.esc(c.category)}</td>
                    <td>${NDUI.esc(c.nextDate)}</td>
                    <td>${NDUI.statusBadge(c.status)}</td>
                    <td><button type="button" class="btn btn-outline btn-sm" data-editm="${NDUI.esc(c.id)}">Edit</button></td>
                  </tr>
                `).join('')}
              </tbody>
            </table></div>
          </div>
        `;
        document.getElementById('addMatTop').onclick = openAddMatterModal;
        host.querySelectorAll('[data-editm]').forEach(b => b.onclick = () => {
          const c = list.find(x => x.id === b.dataset.editm);
          if (!c) return;
          const bd = NDUI.openModal({
            title: `Update ${c.id} — ${c.clientName}`,
            bodyHtml: `
              <form id="emForm">
                <div class="grid-2" style="gap:12px;">
                  <div class="form-group"><label class="form-label">Status</label><select class="form-select" id="emSt">${['Active', 'In Review', 'Scheduled', 'Resolved', 'Closed'].map(s => `<option ${c.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
                  <div class="form-group"><label class="form-label">Next Date</label><input class="form-control" type="date" id="emDt" value="${NDUI.esc(c.nextDate)}"></div>
                </div>
                <div class="form-group"><label class="form-label">Notes</label><textarea class="form-textarea" id="emNotes">${NDUI.esc(c.notes)}</textarea></div>
                <button type="submit" class="btn btn-primary btn-block">Save Updates</button>
              </form>
            `
          });
          bd.querySelector('#emForm').onsubmit = (e) => {
            e.preventDefault();
            NDStore.AdvocateService.updateCase(c.id, { status: bd.querySelector('#emSt').value, nextDate: bd.querySelector('#emDt').value, notes: bd.querySelector('#emNotes').value });
            NDUI.closeModal();
            NDUI.toast('Matter updated.', 'success');
            renderAll();
          };
        });
      }

      function renderMediations() {
        const list = NDStore.MediationService.listRequests();
        const host = document.getElementById('dashMain');
        host.innerHTML = `
          <h1 style="font-size:1.8rem;margin:0 0 4px;">Mediation Queue</h1>
          <p class="text-sm mb-4">Advance mediation requests across their 7 lifecycle stages.</p>
          <div style="display:grid;gap:14px;">
            ${list.map(r => `
              <div class="card flex justify-between items-center flex-wrap gap-3">
                <div>
                  <div class="flex items-center gap-2 flex-wrap"><strong>${NDUI.esc(r.title)}</strong><span class="badge badge-navy">${NDUI.esc(r.id)}</span>${NDUI.statusBadge(r.status)}</div>
                  <div class="text-xs text-muted mt-2">${NDUI.esc(r.category)} · ${NDUI.esc(r.preferredDate)} ${NDUI.esc(r.preferredSlot)} IST</div>
                </div>
                ${r.status !== 'Closed' ? `<button type="button" class="btn btn-outline btn-sm" data-ladv="${NDUI.esc(r.id)}">Advance Stage</button>` : ''}
              </div>
            `).join('')}
          </div>
        `;
        host.querySelectorAll('[data-ladv]').forEach(b => b.onclick = () => {
          const u = NDStore.MediationService.advanceDemoStatus(b.dataset.ladv);
          NDUI.toast(`${u.id} updated to ${u.status}.`, 'success');
          renderAll();
        });
      }

      function renderProfile() {
        const l = NDStore.AdvocateService.getProfile();
        const host = document.getElementById('dashMain');
        host.innerHTML = `
          <h1 style="font-size:1.8rem;margin:0 0 4px;">Directory Profile &amp; Availability Slots</h1>
          <p class="text-sm mb-4">Updates immediately reflect on your profile (${NDUI.esc(l.id)}) in the <a href="lawyers.html" style="text-decoration:underline;">Lawyer Directory</a>.</p>
          <form class="card" id="advProfForm" style="max-width:720px;">
            <div class="grid-2" style="gap:14px;">
              <div class="form-group"><label class="form-label">Display Name</label><input class="form-control" id="apName" value="${NDUI.esc(l.name)}" required></div>
              <div class="form-group"><label class="form-label">City</label><select class="form-select" id="apCity">${NDSeed.CITIES.map(c => `<option ${c.name === l.city ? 'selected' : ''}>${NDUI.esc(c.name)}</option>`).join('')}</select></div>
              <div class="form-group"><label class="form-label">Primary Practice Area</label><select class="form-select" id="apArea">${NDSeed.PRACTICE_AREAS.map(a => `<option ${a === l.primaryArea ? 'selected' : ''}>${NDUI.esc(a)}</option>`).join('')}</select></div>
              <div class="form-group"><label class="form-label">Consultation Fee (₹)</label><input class="form-control" type="number" id="apFee" value="${l.fee}" min="0" required></div>
              <div class="form-group"><label class="form-label">Languages (comma-separated)</label><input class="form-control" id="apLangs" value="${NDUI.esc(l.languages.join(', '))}" required></div>
              <div class="form-group"><label class="form-label">Time Slots (HH:MM, comma-separated)</label><input class="form-control" id="apSlots" value="${NDUI.esc(l.slots.join(', '))}" required></div>
            </div>
            <div class="form-group"><label class="form-label">Biography</label><textarea class="form-textarea" id="apBio">${NDUI.esc(l.bio)}</textarea></div>
            <button type="submit" class="btn btn-primary">Save Directory Profile</button>
          </form>
        `;
        document.getElementById('advProfForm').onsubmit = (e) => {
          e.preventDefault();
          try {
            NDStore.AdvocateService.updateProfile({
              name: document.getElementById('apName').value,
              city: document.getElementById('apCity').value,
              primaryArea: document.getElementById('apArea').value,
              fee: document.getElementById('apFee').value,
              languages: document.getElementById('apLangs').value,
              slots: document.getElementById('apSlots').value,
              bio: document.getElementById('apBio').value
            });
            NDUI.renderNavbar('dashboard');
            NDUI.toast('Directory profile updated!', 'success');
            renderAll();
          } catch (err) { NDUI.toast(err.message, 'error'); }
        };
      }

      function renderSettings() {
        document.getElementById('dashMain').innerHTML = `
          <h1 style="font-size:1.8rem;margin:0 0 4px;">Settings</h1>
          <p class="text-sm mb-4">Switch between Citizen and Lawyer portals or reset your workspace data.</p>
          <div class="card" style="max-width:600px;">
            <div class="flex gap-3 flex-wrap mb-4">
              <button type="button" class="btn btn-primary" id="swCitSet">Switch to Citizen Portal</button>
              <button type="button" class="btn btn-danger" id="rstAllLaw">Reset Workspace Data</button>
            </div>
            <p class="text-xs text-muted mb-0">Resetting restores directory profiles, appointments, matters, documents, and notifications to their initial state.</p>
          </div>
        `;
        document.getElementById('swCitSet').onclick = () => { NDStore.AuthService.demoLogin('client'); location.href = 'Dashboard.html'; };
        document.getElementById('rstAllLaw').onclick = async () => {
          const ok = await NDUI.confirmDialog({ title: 'Reset Workspace Data', message: 'Restore all initial workspace data?', confirmText: 'Reset', destructive: true });
          if (!ok) return;
          NDStore.DemoAdminService.resetAll();
          NDUI.toast('Workspace data reset.', 'success');
          renderAll();
        };
      }

      const MAP = { overview: renderOverview, consultations: renderConsultations, matters: renderMatters, mediations: renderMediations, profile: renderProfile, settings: renderSettings };
      function renderAll() {
        const sb = buildSidebar();
        document.getElementById('desktopSidebar').innerHTML = sb;
        document.getElementById('mobileSidebarHost').innerHTML = sb;
        wireSidebar(document.getElementById('desktopSidebar'));
        wireSidebar(document.getElementById('mobileSidebarHost'));
        (MAP[currentSec] || renderOverview)();
      }
      window.goSection = goSection;
      renderAll();
    }
  </script>
</body>
</html>
